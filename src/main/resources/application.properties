# Reduce logging level to make sure the application works with SAM local
# https://github.com/aws/serverless-java-container/issues/134
logging.level.root=WARN

spring.application.name=vehicle-registration-system-aws

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000

# Swagger URLs include the API Gateway stage when running in Lambda.
springdoc.swagger-ui.config-url=${API_STAGE_PATH:}/v3/api-docs/swagger-config
springdoc.swagger-ui.url=${API_STAGE_PATH:}/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true

# Document the functionality implemented in this stage.
springdoc.paths-to-match=/api/**
# Stage 3: preserve the original RC validity used by the approval workflow.
vrs.registration.validity-years=15
